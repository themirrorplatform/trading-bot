# SESSION SPECIFICATION
# Temporal structure, no-trade windows, session-specific behavior

version: "2.0.0"
changelog:
  v2.0.0:
    - "Enable 24/7 GLOBEX trading for MES futures"
    - "Add ETH (Extended Trading Hours) session definition"
    - "Reduce no-trade windows for continuous operation"
    - "Allow overnight positions with proper risk management"
  v1.0.1:
    - "Canonicalized no-trade windows as structured entries (testable, computable)"
    - "Explicitly marked session.yaml as single source of truth for temporal gates"
    - "Added fallback and fail-closed behaviors for missing/unknown schedule"

# ==========================================
# SESSION DEFINITION - 24/7 GLOBEX
# ==========================================
session:
  primary_session: "GLOBEX"  # 24/7 futures trading (was RTH)
  timezone: "US/Eastern"

  # GLOBEX schedule (MES futures)
  # Sunday 6:00 PM ET - Friday 5:00 PM ET
  # Daily maintenance: 5:00 PM - 6:00 PM ET (Mon-Thu)
  globex:
    week_open: "Sunday 18:00"      # Sunday 6 PM ET
    week_close: "Friday 17:00"     # Friday 5 PM ET
    daily_maintenance_start: "17:00"  # 5 PM ET
    daily_maintenance_end: "18:00"    # 6 PM ET
    trading_days: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]

  # RTH schedule (subset of GLOBEX, higher liquidity)
  rth:
    open_time: "09:30"
    close_time: "16:00"
    trading_days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]

  # ETH schedule (Extended Trading Hours - outside RTH)
  eth:
    evening_start: "18:00"   # 6 PM ET (after maintenance)
    evening_end: "09:30"     # Until RTH open next day
    afternoon_start: "16:00" # After RTH close
    afternoon_end: "17:00"   # Until maintenance

  # Overnight positions NOW ALLOWED for 24/7 operation
  flatten_before_close: false  # Changed from true - allow overnight
  flatten_time: null           # No forced flatten
  weekly_flatten_time: "Friday 16:45"  # Flatten before weekend (optional safety)
  canonical_source: true  # Constitution references this file for all session gates
  
# ==========================================
# NO-TRADE WINDOWS (Session Gates)
# ==========================================
# Reduced windows for 24/7 operation - only block maintenance and high-risk periods
no_trade_windows:
  - id: "DAILY_MAINTENANCE"
    enabled: true
    start_time: "17:00"
    end_time: "18:00"
    reason: "CME daily maintenance window - no trading"

  - id: "OPENING_BLOCK"
    enabled: true
    start_time: "09:30"
    end_time: "09:32"
    reason: "RTH opening auction - reduced from 5 to 2 minutes"

  - id: "LUNCH_BLOCK"
    enabled: false  # DISABLED for 24/7 - can still trade during lunch
    start_time: "11:30"
    end_time: "13:30"
    reason: "Low participation (optional - disabled for 24/7)"

  - id: "CLOSE_BLOCK"
    enabled: false  # DISABLED - no forced flatten for 24/7
    start_time: "15:55"
    end_time: "16:00"
    reason: "RTH close (optional - disabled for 24/7)"

  - id: "WEEKEND"
    enabled: true
    start_time: "Friday 17:00"
    end_time: "Sunday 18:00"
    reason: "Weekend closure - market closed"

# Fail-closed behavior: if this section fails to load, trading is disallowed
no_trade_windows_fail_closed: true
    
# ==========================================
# SESSION PHASES (For Context)
# ==========================================
# Used by SessionPhase signal for regime awareness
session_phases:
  # Phase 0: Pre-market (not trading, but observe for gap context)
  pre_market:
    start_time: "08:00"
    end_time: "09:30"
    phase_code: 0
    
  # Phase 1: Opening hour (09:30-10:30)
  opening:
    start_time: "09:30"
    end_time: "10:30"
    phase_code: 1
    characteristics:
      - "High volume"
      - "Volatility auction"
      - "Opening range formation"
      - "Institutional positioning"
    
  # Phase 2: Mid-morning (10:30-11:30)
  mid_morning:
    start_time: "10:30"
    end_time: "11:30"
    phase_code: 2
    characteristics:
      - "Trend or range becomes clear"
      - "Follow-through or fade"
      - "Best phase for mean reversion (F1)"
    
  # Phase 3: Lunch void (11:30-13:30) - NO TRADE
  lunch:
    start_time: "11:30"
    end_time: "13:30"
    phase_code: 3
    characteristics:
      - "Low participation"
      - "Choppy, directionless"
      - "AVOID"
    
  # Phase 4: Afternoon session (13:30-15:00)
  afternoon:
    start_time: "13:30"
    end_time: "15:00"
    phase_code: 4
    characteristics:
      - "Volume returns"
      - "Can resume morning trend or reverse"
      - "Continuation or reversal clarity"
    
  # Phase 5: Close hour (15:00-16:00)
  close:
    start_time: "15:00"
    end_time: "16:00"
    phase_code: 5
    characteristics:
      - "Institutional positioning for overnight"
      - "VWAP anchoring"
      - "Momentum continuation or fade to VWAP"
      - "Flatten by 15:55"
    
# ==========================================
# VWAP SESSION RESET
# ==========================================
# For 24/7: VWAP resets at GLOBEX open (Sunday 6 PM) or daily at RTH open
vwap_config:
  reset_time: "09:30"  # Still reset at RTH open for consistency
  session_type: "GLOBEX"  # Include all GLOBEX bars in VWAP
  include_overnight: true  # Now include overnight bars

  # Compute separate VWAPs for analysis
  compute_rth_vwap: true      # Traditional RTH-only VWAP
  compute_globex_vwap: true   # Full 24-hour VWAP
  primary_vwap: "GLOBEX"      # Use GLOBEX VWAP for signals
  
# ==========================================
# SPECIAL DAYS (Holidays, Half-Days)
# ==========================================
special_days:
  # Use external calendar feed (calendar.yaml) or fallback behavior
  fallback_behavior:
    unknown_schedule_day: "OBSERVE_ONLY"  # If unsure, don't trade
    missing_calendar_file: "OBSERVE_ONLY"  # Fail-closed
    
  # Known half-days (early close at 13:00)
  half_days:
    - "2025-07-03"  # Day before Independence Day
    - "2025-11-28"  # Day after Thanksgiving
    - "2025-12-24"  # Christmas Eve
    # Add more as needed
    
  # Market closed
  holidays:
    - "2025-01-01"  # New Year's Day
    - "2025-01-20"  # MLK Day
    - "2025-02-17"  # Presidents Day
    - "2025-04-18"  # Good Friday
    - "2025-05-26"  # Memorial Day
    - "2025-07-04"  # Independence Day
    - "2025-09-01"  # Labor Day
    - "2025-11-27"  # Thanksgiving
    - "2025-12-25"  # Christmas
    # Update annually
    
# ==========================================
# 24/7 OPERATION NOTES
# ==========================================
# v2.0: Now trading full GLOBEX session
# - Sunday 6 PM ET through Friday 5 PM ET
# - Daily maintenance window: 5-6 PM ET (Mon-Thu)
# - RTH (9:30 AM - 4 PM ET) has highest liquidity
# - ETH has lower volume but valid setups exist
#
# Risk considerations for 24/7:
# - Wider stops during low-liquidity ETH
# - Position sizing may be reduced during ETH
# - Kill switch still active at all times
# - Weekly flatten optional (Friday 4:45 PM)

# Fail-closed policy (constitutional expectation):
# If session.yaml cannot be loaded or parsed, default to OBSERVE_ONLY.
